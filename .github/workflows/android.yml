name: Build Android APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare web folder
        run: |
          mkdir -p public
          cp index.html sim.js config.js manifest.json icon-*.png public/
          echo '{"appId":"com.example.martialrumble","appName":"Martial RUMBLE","webDir":"public","backgroundColor":"#0d0907","server":{"androidScheme":"https"}}' > capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: martial-rumble-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
